<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Goody Hearts Club — Small art, big hearts</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  @font-face {
    font-family: "Wonder";
    src: url("uploads/fonnts.com-wonder-regular.otf") format("opentype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0020-0023, U+0025-0026, U+0028-002E, U+003F-005A, U+0061-007A, U+00C0-024F;
  }
  @font-face {
    font-family: "Wonder";
    src: url("uploads/fonnts.com-wonder-medium.otf") format("opentype");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0020-0023, U+0025-0026, U+0028-002E, U+003F-005A, U+0061-007A, U+00C0-024F;
  }
  @font-face {
    font-family: "Wonder";
    src: url("uploads/fonnts.com-wonder-extrabold.otf") format("opentype");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0020-0023, U+0025-0026, U+0028-002E, U+003F-005A, U+0061-007A, U+00C0-024F;
  }
  /* Design tokens are set by tokens.js — edit that file, not here. */

  @media (max-width: 768px) {
    :root { --page-px: 30px; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background-color: #FCFCFC;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.01em;
    overflow-x: hidden;
  }
  h1, h2, h3, h4, h5, h6 { font-weight: 400; }
  img, svg { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("https://images.unsplash.com/photo-1712145176570-6cb1d98a126a?auto=format&fit=crop&w=1600&q=60");
    background-size: cover;
    background-attachment: fixed;
    mix-blend-mode: multiply;
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }

  /* keep page from jumping when modals open */
  body.lock { overflow: hidden; }

  /* utility — accessibility */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* default focus ring */
  :focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; border-radius: 6px; }

  /* keyframes used across pages */
  @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes slideInUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes pop { 0% { transform: scale(.85); opacity:0; } 60% { transform: scale(1.04); opacity:1; } 100% { transform: scale(1); } }
  @keyframes wiggle {
    0%,100% { transform: rotate(-2deg); }
    50%     { transform: rotate(2deg); }
  }
  @keyframes drift {
    0%   { transform: translate(0,0) rotate(var(--r,0deg)); }
    50%  { transform: translate(0,-6px) rotate(calc(var(--r,0deg) + 1deg)); }
    100% { transform: translate(0,0) rotate(var(--r,0deg)); }
  }
</style>
</head>
<body>
  <div id="root" aria-busy="true">
    <!-- splash to avoid flash of unstyled content -->
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#FCFCFC;color:#101010;font-family:'Inter',sans-serif;">
      <div style="text-align:center;">
        <img src="assets/logo.png" alt="Goody Hearts Club" style="height:32px;width:auto;" />
        <div style="margin-top:8px;color:#9C9C9C;font-size:14px;">loading…</div>
      </div>
    </div>
  </div>

  <script src="tokens.js"></script>

  <!-- React + Babel pinned -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="stickers.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="pages.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
